app = "fusion-app"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  DB_HOST = "localhost"
  DB_USER = "root"
  DB_PASSWORD = ""
  DB_NAME = "mwamunda"
  PHP_MEMORY_LIMIT = "256M"
